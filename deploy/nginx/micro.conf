# ============================================================
# Nginx — Configuración para micro.panaderia-otto.shop
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name micro.panaderia-otto.shop;

    # Headers de seguridad y proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Tamaño máximo de subida (para imágenes)
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/micro_access.log;
    error_log  /var/log/nginx/micro_error.log;

    # API Gateway (.NET)
    location /api/ {
        proxy_pass http://panaderia_ms_gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (Angular)
    location / {
        proxy_pass http://panaderia_frontend_master:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
