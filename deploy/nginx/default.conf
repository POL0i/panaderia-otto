# ============================================================
# Nginx — Configuración para panaderia-otto.shop
# HTTP → redirige a HTTPS
# HTTPS → sirve la app Laravel
# ============================================================

# Redirigir todo HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name panaderia-otto.shop www.panaderia-otto.shop;

    # Certbot challenge (renovación automática SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — servidor principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name panaderia-otto.shop www.panaderia-otto.shop;

    root /var/www/html/public;
    index index.php;

    # ---- Certificados SSL (Certbot los genera aquí) ----
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Seguridad SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Tamaño máximo de subida
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/panaderia_access.log;
    error_log  /var/log/nginx/panaderia_error.log;

    # Laravel — todas las rutas pasan por index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — procesar archivos .php
    location ~ \.php$ {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # Assets estáticos — cache agresivo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Bloquear acceso a archivos sensibles
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location ~ ^/(storage|bootstrap/cache) {
        deny all;
        return 404;
    }
}
