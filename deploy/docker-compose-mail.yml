version: "3.9"

# ============================================================
# Panadería Otto — Stack de Correo (INDEPENDIENTE de la app)
# Servicios: docker-mailserver (Postfix+Dovecot) + Roundcube
#
# Levantar:   docker compose -f deploy/docker-compose-mail.yml up -d
# Detener:    docker compose -f deploy/docker-compose-mail.yml stop
# Desinstalar: bash deploy/uninstall-mail.sh
# ============================================================

services:

  # ----------------------------------------------------------
  # MAILSERVER — Postfix (SMTP) + Dovecot (IMAP)
  # Imagen oficial: https://github.com/docker-mailserver/docker-mailserver
  # ----------------------------------------------------------
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: panaderia_mailserver
    hostname: correo.panaderia-otto.shop
    domainname: panaderia-otto.shop
    restart: unless-stopped
    ports:
      - "25:25"       # SMTP  (recibir correos externos)
      - "465:465"     # SMTPS (envío seguro)
      - "587:587"     # SMTP Submission (clientes de correo)
      - "993:993"     # IMAPS (leer correos, cifrado)
      - "143:143"     # IMAP  (leer correos, sin cifrar — solo LAN)
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
      # Usa el mismo certificado SSL que Nginx (Let's Encrypt)
      - ./nginx/ssl/fullchain.pem:/etc/letsencrypt/live/correo.panaderia-otto.shop/fullchain.pem:ro
      - ./nginx/ssl/privkey.pem:/etc/letsencrypt/live/correo.panaderia-otto.shop/privkey.pem:ro
    environment:
      # Dominio y hostname
      - DOMAINNAME=panaderia-otto.shop
      - HOSTNAME=correo

      # SSL — usa el certificado de Let's Encrypt que ya tenemos
      - SSL_TYPE=letsencrypt

      # Seguridad anti-spam
      - ENABLE_SPAMASSASSIN=1
      - SPAMASSASSIN_SPAM_TO_JUNK=1
      - ENABLE_CLAMAV=0          # desactivado para ahorrar RAM (~200MB)
      - ENABLE_FAIL2BAN=1

      # DMARC/DKIM/SPF (ya configurados en Spaceship)
      - ENABLE_OPENDKIM=1
      - ENABLE_OPENDMARC=1
      - ENABLE_POLICYD_SPF=1

      # Tamaño máximo de correo (20MB)
      - POSTFIX_MESSAGE_SIZE_LIMIT=20971520

      # Zona horaria
      - TZ=America/La_Paz
    cap_add:
      - NET_ADMIN               # necesario para fail2ban
    networks:
      - mail_net
    healthcheck:
      test: ["CMD", "ss", "-lntp", "|", "grep", ":25"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # ROUNDCUBE — Webmail (interfaz visual de correo)
  # Accesible en: https://correo.panaderia-otto.shop
  # ----------------------------------------------------------
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: panaderia_roundcube
    restart: unless-stopped
    ports:
      - "8080:80"               # Nginx externo hace proxy a este puerto
    environment:
      # Conectar al mailserver de arriba
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mailserver
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587

      # Base de datos de Roundcube (SQLite, sin instalar MySQL extra)
      - ROUNDCUBEMAIL_DB_TYPE=sqlite

      # Nombre de la app
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_PRODUCT_NAME=Panadería Otto Webmail

      # Plugins útiles
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve,emoticons

      # Zona horaria
      - TZ=America/La_Paz
    volumes:
      - roundcube_db:/var/roundcube/db
      - roundcube_temp:/tmp/roundcube-temp
    depends_on:
      - mailserver
    networks:
      - mail_net

  # ----------------------------------------------------------
  # NGINX-MAIL — Proxy para Roundcube con SSL
  # Sirve correo.panaderia-otto.shop con HTTPS
  # ----------------------------------------------------------
  nginx-mail:
    image: nginx:1.25-alpine
    container_name: panaderia_nginx_mail
    restart: unless-stopped
    ports:
      - "8443:443"              # Puerto HTTPS para el webmail
    volumes:
      - ./nginx/mail.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - roundcube
    networks:
      - mail_net

# ----------------------------------------------------------
# VOLÚMENES persistentes
# ----------------------------------------------------------
volumes:
  mail_data:
    name: panaderia_mail_data
  mail_state:
    name: panaderia_mail_state
  mail_logs:
    name: panaderia_mail_logs
  mail_config:
    name: panaderia_mail_config
  roundcube_db:
    name: panaderia_roundcube_db
  roundcube_temp:
    name: panaderia_roundcube_temp

# ----------------------------------------------------------
# RED interna del stack de correo
# ----------------------------------------------------------
networks:
  mail_net:
    name: panaderia_mail_net
    driver: bridge
