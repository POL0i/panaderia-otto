;
;      poste.io mailserver configuration
;   YOU MUST RESTART CONTAINER AFTER CHANGE
;

[server]
; config.server_help

server_hostname = "correo.panaderia-otto.shop"
bounce_email = ""
alerts_email = ""
default_domain= ""

[relay]
; config.relay_help

relay_hosts = "172.16.0.0/12"

[routing]
; config.smtp_routes_help

smtp_routes = ""

[DNSBL]
; config.dnsbl_help

dnsbl_servers = "b.barracudacentral.org, truncate.gbudb.net, psbl.surriel.com, bl.spamcop.net, dnsbl-1.uceprotect.net, zen.spamhaus.org, dnsbl.justspam.org, list.dnswl.org, hostkarma.junkemailfilter.com"

[lets_encrypt]
; config.le_help

; cert_domains = 

[brand]
; config.brand_help

brand_name = "poste.io"



[rspamd_inbound]
; config.rspamd_inbound_help

rspamd_inbound_enabled = 1
rspamd_inbound_quarantine = 1
rspamd_inbound_block_score = 12
rspamd_inbound_quarantine_misbehaving = 1
rspamd_inbound_change_subject_enabled = 1
rspamd_inbound_change_subject_score = 6
rspamd_inbound_change_subject_prepend = "*****SPAM*****"

[rspamd_outbound]
; config.rspamd_outbound_help

rspamd_outbound_enabled = 0

[clamav_inbound]
; config.clamav_inbound_help

clamav_inbound_enabled = 1

[clamav_outbound]
; config.clamav_outbound_help

clamav_outbound_enabled = 1

[srs]
; config.srs_help

srs_enabled = 1
srs_secret = "93234d7c664c9de4"

[strict_from_check]
; config.strict_from_help

strict_from_check_enabled = 0

[cleaning]
; config.cleaning_help

dmarcs = 1
dmarcs_interval = 30
quarantine = 1
quarantine_interval = 30
delivery_log = 1
delivery_log_interval = 30
auth_log = 1
auth_log_interval = 30
raw_log = 1
raw_log_interval = 3
inbox_trash = 1
inbox_trash_interval = 30
inbox_junk = 1
inbox_junk_interval = 30

[email]
; config.email_help

max_size = 26214400

[privacy]
; config.privacy_help

remove_x_headers = 1
remove_user_agent = 0
set_received_from_to_localhost = 1

[connections_banning]
; config.block_bad_connections_help

ban_bad_connections=1
invalid_connections_count=100
counter_expiration=86400
block_expiration=86400

[dmarc]
; config.dmarc

send_reports=0
org_name=""
org_domain=""
sender_email=""

[sieve]
; config.sieve

max_actions=40
max_redirects=40
[inspection]
; config.inspection_help

log_subject = 0
copy_emails = 0
target_email = 

[Dav]
; config.dav

dav_enabled = 0
dav_debug = 0
webdav_enabled = 0

[tls]
; config.tls_help

auth_required = 1
inbound_min_version = ""
inbound_ciphers = ""

[ignore]
; config.ignore_help

ignore_ips = 

[performance]
; config.performance_help

high_performance_mode = false

[monitoring]
; config.monitoring_help

monitoring_enabled = 0
monitoring_token = ""
monitoring_heartbeat_enabled = 0
monitoring_heartbeat_url = ""
monitoring_heartbeat_interval = 60

