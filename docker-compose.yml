version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /opt/lampp/var/mysql/mysql.sock:/opt/lampp/var/mysql/mysql.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
      - mailserver

  mailserver:
    image: analogic/poste.io
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=America/La_Paz
      - HTTPS=OFF
      - HTTP_PORT=80
      - DISABLE_CLAMAV=TRUE
      - DISABLE_RSPAMD=TRUE
    volumes:
      - ./docker/mailserver:/data
